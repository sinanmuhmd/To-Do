<!DOCTYPE html>
<html lang="en">
{% load static %}

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="{% static 'style.css' %}">

</head>

<body>
    <div class="container">

        <h1>To-Do List</h1>

        <form method="POST" class="todo-form">
            {% csrf_token %} {{ forms }}
            <button type="submit">Add Task</button>
        </form>

        <table>
            <thead>
                <tr>
                    <th>Task</th>
                    <th>Delete</th>
                </tr>
            </thead>

            <tbody>
                {% for data in todo %}
                <tr>
                    <td>{{ data.title }}</td>

                    <td>
                        <form action="{% url 'del' data.id %}" method="POST">
                            {% csrf_token %}
                            <button type="submit" class="delete-btn">Delete</button>
                        </form>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>

    </div>
</body>

</html>
